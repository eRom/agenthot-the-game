<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Martian Mono";
          font-weight: 300 400;
          src: url("assets/fonts/martian-mono-300-400.woff2") format("woff2");
        }
        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: #0d111b;
        }
        /* Prises et gel : plein cadre, recadrées sans déformation */
        #root .shot {
          position: absolute;
          top: 0;
          left: 0;
          width: 1920px;
          height: 1080px;
          object-fit: cover;
          transform-origin: 50% 50%;
          z-index: 1;
        }
        /* Libellé de temps : petite plaque void, Martian Mono 18 px (règle commune des cadres 1 à 3) */
        #root .readout {
          position: absolute;
          left: 72px;
          bottom: 64px;
          display: inline-block;
          padding: 8px 14px;
          background: rgba(13, 17, 27, 0.78);
          font-family: "Martian Mono", monospace;
          font-weight: 400;
          font-size: 18px;
          line-height: 1.2;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          white-space: nowrap;
          color: #c9cbd0;
          opacity: 0;
          z-index: 10;
        }
      </style>

      <div id="root" data-composition-id="03-drop" data-width="1920" data-height="1080" data-duration="7.384">
        <!-- g1 : le replay reprend à pleine vitesse (0 à 5.016 s locales) -->
        <video id="g1_v1" class="clip shot" src="assets/captures/replay-a.mp4" muted playsinline data-volume="0" data-start="0" data-duration="1.022" data-media-start="3.117" data-track-index="0"></video>
        <video id="g1_v2" class="clip shot" src="assets/captures/replay-d.mp4" muted playsinline data-volume="0" data-start="1.022" data-duration="0.999" data-media-start="3.2" data-track-index="0"></video>
        <video id="g1_v3" class="clip shot" src="assets/captures/replay-c.mp4" muted playsinline data-volume="0" data-start="2.021" data-duration="0.952" data-media-start="1.0" data-track-index="0"></video>
        <video id="g1_v4" class="clip shot" src="assets/captures/replay-c.mp4" muted playsinline data-volume="0" data-start="2.973" data-duration="1.021" data-media-start="5.0" data-track-index="0"></video>
        <video id="g1_v5" class="clip shot" src="assets/captures/replay-f.mp4" muted playsinline data-volume="0" data-start="3.994" data-duration="1.022" data-media-start="4.3" data-track-index="0"></video>

        <!-- g2 : trois éclatements de plus en plus rapides, puis ralenti (5.016 à 7.384 s locales) -->
        <video id="g2_v6" class="clip shot" src="assets/captures/replay-e.mp4" muted playsinline data-volume="0" data-start="5.016" data-duration="0.464" data-media-start="5.0" data-track-index="0"></video>
        <video id="g2_v7" class="clip shot" src="assets/captures/replay-b.mp4" muted playsinline data-volume="0" data-start="5.48" data-duration="0.302" data-media-start="1.7" data-track-index="0"></video>
        <video id="g2_v8" class="clip shot" src="assets/captures/replay-f.mp4" muted playsinline data-volume="0" data-start="5.782" data-duration="0.697" data-media-start="8.3" data-track-index="0"></video>
        <!-- ralenti à 3 % du jeu : replay-f depuis 8.997 s source à 0.25x, poussée lente sur le conteneur (jamais sur la prise) -->
        <div id="g2_slowmo_wrap" class="shot">
          <video id="g2_slowmo" class="clip shot" src="assets/captures/replay-f.mp4" muted playsinline data-volume="0" data-start="6.479" data-duration="0.905" data-media-start="8.997" data-playback-rate="0.25" data-track-index="0"></video>
        </div>

        <div id="g1_readout" class="readout">TEMPS 100 %</div>
        <div id="g2_readout" class="readout">TEMPS 3 %</div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Libellé de temps : bascule à 0 ms sur le ralenti (18.553 - 12.074 = 6.479)
        tl.set("#g1_readout", { autoAlpha: 1 }, 0);
        tl.set("#g2_readout", { autoAlpha: 0 }, 0);
        tl.set("#g1_readout", { autoAlpha: 0 }, 6.479);
        tl.set("#g2_readout", { autoAlpha: 1 }, 6.479);

        // Secousse de 3 images (30 fps), à 0 ms, sur les deux caisses claires fortes :
        // 13.096 -> 1.022 s locales (g1_v2), 16.579 -> 4.505 s locales (g1_v5).
        // Un léger agrandissement pendant la secousse cache les bords de l'image.
        const frameDur = 1 / 30;
        const shakeSteps = [
          { x: 22, y: -14 },
          { x: -18, y: 12 },
          { x: 10, y: -6 },
        ];
        [
          { id: "#g1_v2", at: 1.022 },
          { id: "#g1_v5", at: 4.505 },
        ].forEach((shake) => {
          shakeSteps.forEach((step, i) => {
            tl.set(shake.id, { x: step.x, y: step.y, scale: 1.05 }, shake.at + i * frameDur);
          });
          tl.set(shake.id, { x: 0, y: 0, scale: 1 }, shake.at + shakeSteps.length * frameDur);
        });

        // Poussée lente et linéaire sur le ralenti (1.0 vers 1.06)
        tl.fromTo("#g2_slowmo_wrap", { scale: 1 }, { scale: 1.06, duration: 0.905, ease: "none" }, 6.479);

        window.__timelines["03-drop"] = tl;
        tl.seek(0);
      </script>
    </template>
  </body>
</html>
