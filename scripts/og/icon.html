<!doctype html>
<!-- Icône du site en PNG (apple-touch-icon, 180 × 180) : public/favicon.svg capturé par Chrome sans écran.
     Commande dans le plan 3c, tâche des balises de partage. -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
      }
      html,
      body {
        width: 180px;
        height: 180px;
        overflow: hidden;
        background: #0d111b;
      }
      img {
        display: block;
        width: 180px;
        height: 180px;
      }
    </style>
  </head>
  <body>
    <img src="../../public/favicon.svg" alt="" />
  </body>
</html>
